name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@v1.16.0
        timeout-minutes: 5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: anthropic/claude-sonnet-4-20250514
          use_github_token: true
          prompt: |
            Revise este PR:

            - Commits seguem Conventional Commits?
            - Código segue o padrão do projeto? (PT-BR, construtores primários, PascalCase)
            - Tem testes para as mudanças?
            - `dotnet test` e `ng test` passariam?

            Responda em português: resumo das mudanças, problemas encontrados, sugestões.
