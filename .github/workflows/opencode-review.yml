name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr diff "$PR_NUMBER" > /tmp/pr-diff.txt 2>&1
          gh pr view "$PR_NUMBER" --json commits --jq '.commits[].messageHeadline' > /tmp/pr-commits.txt 2>&1

      - name: Generate and post review
        shell: python3 {0}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          import json, os, urllib.request

          key = os.environ['GOOGLE_API_KEY']
          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPO']
          pr = os.environ['PR_NUMBER']

          diff = open('/tmp/pr-diff.txt').read()
          commits = open('/tmp/pr-commits.txt').read()

          prompt = 'Revise este PR:\n\nCommits:\n' + commits + '\n\nDiff:\n' + diff + '\n\n- Commits seguem Conventional Commits?\n- Codigo segue o padrao do projeto? (PT-BR, construtores primarios, PascalCase)\n- Tem testes para as mudancas?\n- Testes passariam?\n\nResponda em portugues: resumo das mudancas, problemas encontrados, sugestoes.'

          body = json.dumps({'contents': [{'parts': [{'text': prompt}]}]}).encode()
          req = urllib.request.Request(
              'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + key,
              data=body, headers={'Content-Type': 'application/json'})
          resp = json.loads(urllib.request.urlopen(req).read())
          review = resp['candidates'][0]['content']['parts'][0]['text']

          comment_body = json.dumps({'body': review}).encode()
          req2 = urllib.request.Request(
              'https://api.github.com/repos/' + repo + '/issues/' + pr + '/comments',
              data=comment_body,
              headers={
                  'Authorization': 'Bearer ' + token,
                  'Content-Type': 'application/json',
                  'Accept': 'application/vnd.github.v3+json'
              })
          urllib.request.urlopen(req2)
          print('Review publicado com sucesso!')
