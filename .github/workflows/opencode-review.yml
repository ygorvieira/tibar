name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Review PR
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          gh pr diff "$PR_NUMBER" > /tmp/pr-diff.txt 2>&1
          gh pr view "$PR_NUMBER" --json commits --jq '.commits[].messageHeadline' > /tmp/pr-commits.txt 2>&1

          python3 << 'PYEOF'
import json, os, urllib.request

key = os.environ.get('GOOGLE_API_KEY', '')
token = os.environ.get('GH_TOKEN', '')
repo = os.environ.get('GITHUB_REPO', '')
pr = os.environ.get('PR_NUMBER', '')

diff = open('/tmp/pr-diff.txt').read()
commits = open('/tmp/pr-commits.txt').read()

prompt = f'''Revise este PR:

Commits:
{commits}

Diff:
{diff}

- Commits seguem Conventional Commits?
- Codigo segue o padrao do projeto? (PT-BR, construtores primarios, PascalCase)
- Tem testes para as mudancas?
- Testes passariam?

Responda em portugues: resumo das mudancas, problemas encontrados, sugestoes.'''

body = json.dumps({'contents': [{'parts': [{'text': prompt}]}]}).encode()
req = urllib.request.Request(
    f'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key={key}',
    data=body, headers={'Content-Type': 'application/json'})
resp = json.loads(urllib.request.urlopen(req).read())
review = resp['candidates'][0]['content']['parts'][0]['text']

# Post comment via GitHub API
comment_body = json.dumps({'body': review}).encode()
req2 = urllib.request.Request(
    f'https://api.github.com/repos/{repo}/issues/{pr}/comments',
    data=comment_body,
    headers={
        'Authorization': f'Bearer {token}',
        'Content-Type': 'application/json',
        'Accept': 'application/vnd.github.v3+json'
    })
urllib.request.urlopen(req2)
print("Review publicado com sucesso!")
PYEOF
