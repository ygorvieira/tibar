name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Review PR
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Revisando PR #$PR_NUMBER..."

          gh pr diff "$PR_NUMBER" > /tmp/pr-diff.txt 2>&1
          gh pr view "$PR_NUMBER" --json commits --jq '.commits[].messageHeadline' > /tmp/pr-commits.txt 2>&1

          python3 << 'PYEOF' 2>/tmp/py-err.log
import json, os, urllib.request

key = os.environ.get('GOOGLE_API_KEY', '')
diff = open('/tmp/pr-diff.txt').read()
commits = open('/tmp/pr-commits.txt').read()

prompt = f'''Revise este PR:

Commits:
{commits}

Diff:
{diff}

- Commits seguem Conventional Commits?
- Codigo segue o padrao do projeto? (PT-BR, construtores primarios, PascalCase)
- Tem testes para as mudancas?
- Testes passariam?

Responda em portugues: resumo das mudancas, problemas encontrados, sugestoes.'''

body = json.dumps({'contents': [{'parts': [{'text': prompt}]}]}).encode()
req = urllib.request.Request(
    f'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key={key}',
    data=body, headers={'Content-Type': 'application/json'})
resp = json.loads(urllib.request.urlopen(req).read())
review = resp['candidates'][0]['content']['parts'][0]['text']

with open('/tmp/review.txt', 'w') as f:
    f.write(review)
PYEOF

          if [ -f /tmp/review.txt ] && [ -s /tmp/review.txt ]; then
            gh pr comment "$PR_NUMBER" --body "$(cat /tmp/review.txt)"
            echo "Review publicado com sucesso!"
          else
            echo "Review vazio, verificando erro..."
            cat /tmp/py-err.log 2>/dev/null || true
            gh pr comment "$PR_NUMBER" --body "⚠️ Revisão automática falhou."
          fi
