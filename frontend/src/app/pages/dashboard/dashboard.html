<h1>Painel</h1>

<div class="filters">
  <label>
    Início
    <input type="date" [(ngModel)]="startDate" />
  </label>
  <label>
    Fim
    <input type="date" [(ngModel)]="endDate" />
  </label>
  <button class="btn-secondary" (click)="filter()" [disabled]="loading()">Filtrar</button>
</div>

@if (loading()) {
  <p class="loading">Carregando...</p>
} @else if (balance) {
  <div class="cards">
    <div class="card income">
      <h3>Receitas</h3>
      <span class="value">{{ balance.totalIncome | currency: balance.currency }}</span>
    </div>

    <div class="card expense">
      <h3>Despesas</h3>
      <span class="value">{{ balance.totalExpense | currency: balance.currency }}</span>
    </div>

    <div class="card balance" [class.positive]="balance.balance >= 0" [class.negative]="balance.balance < 0">
      <h3>Saldo</h3>
      <span class="value">{{ balance.balance | currency: balance.currency }}</span>
    </div>
  </div>
}
